<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familiendashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234F8EF7'/><path d='M8 16l8-7 8 7v8H8z' fill='white'/></svg>">
</head>
<body>
  <main class="board" id="board">
    <!-- clock + weather: wide (morning/evening, picture on the right half) or
         compact (day/afternoon, picture behind everything) – see SCENES in app.js -->
    <section class="panel clock-card" id="clock-card">
      <div class="wx-bg" id="wx-bg"></div>
      <div class="cc-clock">
        <div class="time-row">
          <div class="time" id="time">--:--</div>
          <div class="waste" id="waste"></div>
        </div>
        <div class="date" id="date"></div>
      </div>
      <div class="cc-weather weather" id="weather"></div>
    </section>

    <section class="panel shopping" id="shopping"></section>

    <!-- AI card: briefing for today (morning, instead of Bring!) or outlook
         on tomorrow (evening, above the photos) -->
    <section class="panel briefing" id="briefing"></section>

    <section class="panel news" id="news"></section>

    <section class="photo-frame" id="photo-frame"><img class="ph" alt=""><img class="ph" alt=""></section>

    <section class="school-row" id="school"></section>

    <section class="calendars" id="calendars"></section>
  </main>

  <!-- night scene: dimmed clock + current weather, optionally on a picture (NIGHT_BG) -->
  <div class="night-clock" id="night-clock">
    <div class="n-bg" id="night-bg"></div>
    <div class="n-content">
      <div class="n-time" id="night-time">--:--</div>
      <div class="n-date" id="night-date"></div>
      <div class="n-weather" id="night-weather"></div>
    </div>
  </div>

  <footer class="status" id="status"></footer>
  <script src="calendar-mapping.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
