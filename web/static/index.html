<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familiendashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234F8EF7'/><path d='M8 16l8-7 8 7v8H8z' fill='white'/></svg>">
</head>
<body>
  <main class="board" id="board">
    <section class="panel clock-card">
      <div class="time-row">
        <div class="time" id="time">--:--</div>
        <div class="waste" id="waste"></div>
      </div>
      <div class="date" id="date"></div>
      <div class="weather" id="weather"></div>
    </section>

    <section class="panel shopping" id="shopping"></section>

    <!-- focus zone: content changes with the time of day (see SCENES in app.js) -->
    <section class="focus" id="focus">
      <div class="focus-cards" id="focus-cards"></div>
      <div class="photo-frame" id="photo-frame"><img class="ph" alt=""><img class="ph" alt=""></div>
    </section>

    <section class="school-row" id="school"></section>

    <section class="meals-row" id="meals"></section>

    <section class="calendars" id="calendars"></section>
  </main>

  <!-- night scene: only a dimmed clock -->
  <div class="night-clock" id="night-clock">
    <div class="n-time" id="night-time">--:--</div>
    <div class="n-date" id="night-date"></div>
  </div>

  <footer class="status" id="status"></footer>
  <script src="app.js"></script>
</body>
</html>
